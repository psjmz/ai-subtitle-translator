<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- 指南页模板（v0.9.323）：文章页与索引页共用，服务端按语言注入全部内容。
     v0.9.323 视觉对齐主站（用户定案「跟主站割裂」）：挂全站统一导航 site-topnav.js、
     页头/logo 与工具页同款、主色用 shift 的品牌紫 #4F46E5（首批内容全是 shift 的）。
     ⚠️ 不引 site-i18n / 任何 -core.js —— 界面语言由 URL 前缀决定（服务端已注入），不烧 API 钱。
     ⚠️ 本页自身零版本位；唯一带 ?v= 的是 site-topnav.js 引用（与主站 16 页同一缓存键惯例）。
     ⚠️ 默认标题放在 GUIDE-HEAD 标记内部：服务端整块替换（不会出现双标题），
        直接用文件管理器打开时仍有兜底标题。 -->
<!--GUIDE-HEAD-START-->
<title>Guides – AI-SRTSub</title>
<!--GUIDE-HEAD-END-->
<style>
  :root{
    --ink:#15151A; --sub:#5C5C66; --line:#E7E7EE; --card:#FFFFFF; --bg:#F7F8FA;
    --acc:#4F46E5; --acc-dk:#4338CA;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    font-size:16px;line-height:1.75}
  a{color:var(--acc);text-decoration:none}
  a:hover{text-decoration:underline}
  .gwrap{max-width:820px;margin:0 auto;padding:0 20px 56px}

  /* 页头（与工具页同款：brand 圆角方块 logo + 统一导航 + 语言下拉） */
  .gtop{border-bottom:1px solid var(--line);background:var(--card)}
  .gtop-in{max-width:1080px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:18px}
  .gbrand{display:flex;align-items:center;gap:8px;font-weight:650;font-size:14.5px;
    letter-spacing:-.2px;color:var(--ink);text-decoration:none;flex:none}
  .gbrand:hover .dot{filter:brightness(1.08)}
  .gbrand .dot{width:22px;height:22px;border-radius:7px;background:var(--acc);color:#fff;
    font-size:12.5px;font-weight:700;display:flex;align-items:center;justify-content:center}
  .gbrand:focus-visible{outline:2px solid var(--acc);outline-offset:3px;border-radius:8px}
  .gtop select{height:34px;border:1px solid var(--line);background:var(--card);color:var(--ink);
    font-size:13px;padding:0 8px;border-radius:8px;max-width:46vw;margin-left:auto;flex:none}
  html[dir="rtl"] .gtop-in{flex-direction:row-reverse}

  /* 面包屑 */
  .gcrumb{margin:22px 0 6px;font-size:13px;color:var(--sub)}
  .gcrumb a{color:var(--sub)}
  .gcrumb a:hover{color:var(--acc)}
  .gcrumb span{margin:0 6px;color:var(--line)}
  .gcrumb em{font-style:normal;color:var(--ink)}

  h1{font-size:30px;line-height:1.35;font-weight:700;margin:8px 0 18px;letter-spacing:-.01em}
  .gintro{font-size:17px;color:var(--sub);margin:0 0 8px}
  h2{font-size:22px;font-weight:700;margin:36px 0 10px;line-height:1.4}
  p{margin:10px 0}
  ul{padding-left:22px;margin:10px 0}
  html[dir="rtl"] ul{padding-left:0;padding-right:22px}
  li{margin:6px 0}
  strong{font-weight:700}
  .gfig{margin:20px 0;border:1px solid var(--line);border-radius:12px;background:var(--card);padding:10px;overflow:hidden}
  .gfig img{display:block;width:100%;height:auto;border-radius:8px}
  .gfig figcaption{font-size:13px;color:var(--sub);padding:8px 4px 2px;line-height:1.6}

  /* 行动按钮 */
  .gcta{margin:34px 0 6px}
  .gbtn{display:inline-block;background:var(--acc);color:#fff;font-weight:600;font-size:15px;
    padding:12px 26px;border-radius:10px}
  .gbtn:hover{background:var(--acc-dk);text-decoration:none}

  /* 相关指南 */
  .grelh{font-size:18px;margin-top:36px}
  .grel{list-style:none;padding:0;margin:10px 0}
  .grel li{margin:0 0 8px}
  .grel a{font-weight:600}

  /* 索引页分组列表 */
  .glist{list-style:none;padding:0;margin:12px 0 8px}
  .glist li{border:1px solid var(--line);border-radius:12px;background:var(--card);
    padding:14px 18px;margin:0 0 10px}
  .glist a{font-weight:700;font-size:16px}
  .glist span{display:block;font-size:13.5px;color:var(--sub);margin-top:3px;line-height:1.6}

  /* 页脚 */
  .gfoot{border-top:1px solid var(--line);margin-top:24px;padding:22px 0 8px;
    font-size:13px;color:var(--sub)}
  .gfoot a{color:var(--sub);margin-inline-end:14px}
  .gfoot a:hover{color:var(--acc)}
</style>
<!--ANALYTICS-->
</head>
<body>
  <header class="gtop">
    <div class="gtop-in">
      <!-- 品牌写死双语外的外语统一名（AI-SRTSub）；zh-CN/zh-TW 由下面内联脚本换 -->
      <a class="gbrand" href="/" data-brand-zh="随心字幕 AI" data-brand-zhtw="隨心字幕 AI">
        <span class="dot">字</span>
        <span id="gbrandName">AI-SRTSub</span>
      </a>
      <!-- v0.9.323：全站统一导航（site-topnav.js 渲染，data-tool=gd → 顶栏「使用指南」高亮） -->
      <span id="topNav"></span>
      <select id="glang" aria-label="Language"><!--GUIDE-LANGS--></select>
    </div>
  </header>

  <main class="gwrap">
    <nav class="gcrumb" aria-label="breadcrumb"><!--GUIDE-CRUMB-START--><!--GUIDE-CRUMB-END--></nav>
    <h1><!--GUIDE-H1-START-->Guides<!--GUIDE-H1-END--></h1>
    <article><!--GUIDE-BODY-START--><!--GUIDE-BODY-END--></article>
  </main>

  <footer class="gfoot">
    <div class="gwrap">
      <nav>
        <a href="/guides/">Guides</a>
        <a href="/translate.html">Translate</a>
        <a href="/convert.html">Convert</a>
        <a href="/shift.html">Shift</a>
      </nav>
    </div>
  </footer>

<script>
(function () {
  'use strict';
  /* 界面语言 = URL 前缀（服务端已按它注入全部内容），客户端只做两件事：
     ① 品牌名随语言换（zh-CN/zh-TW 专属写法）；② 语言下拉跳转同路径的其他语言版 */
  var LS = ['zh-CN','zh-TW','en','ja','es','pt','ko','de','fr','id','hi','th','vi','ru','it','ar','tr','nl','pl','sv','cs','uk','da','fi','el','he','ro'];
  var m = location.pathname.match(/^\/([^\/]+)(\/.*)?$/);
  var pre = (m && LS.indexOf(m[1]) >= 0) ? m[1] : 'zh-CN';
  /* zh-CN 的页面没有语言前缀，整条 pathname 才是「换语言时要保住的路径」；带前缀的语言版只取前缀后面的部分 */
  var rest = (pre === 'zh-CN') ? location.pathname : m[2];
  var brand = document.querySelector('.gbrand');
  if (brand) {
    if (pre === 'zh-CN') document.getElementById('gbrandName').textContent = brand.getAttribute('data-brand-zh');
    else if (pre === 'zh-TW') document.getElementById('gbrandName').textContent = brand.getAttribute('data-brand-zhtw');
  }
  var sel = document.getElementById('glang');
  /* option 由服务端按当前语言注入并选中；这里只管「换语言 = 同路径换前缀」 */
  sel.addEventListener('change', function () {
    var v = sel.value;
    if (!v || v === pre) return;
    location.href = (v === 'zh-CN' ? '' : '/' + v) + rest;
  });
})();
</script>
<script src="/site-topnav.js?v=0.9.323" data-tool="gd"></script>
</body>
</html>
