<body>
<div class="wrap">
  <header class="hd">
    <a class="brand" id="logoHome" href="/"><span class="dot">字</span><span data-i18n="brandName">随心字幕 AI</span></a>
    <div class="lnav">
      <span class="navpills" id="navPills"></span>
      <select id="langSel" aria-label="界面语言"></select>
    </div>
  </header>

  <div class="hero">
    <h1><span data-i18n="heroA">字幕</span><em data-i18n="heroEm">乱码修复</em></h1>
    <p data-i18n="heroSub">认出它原本是什么编码，把读错的字换回去。字幕的序号、时间轴一个字都不动。</p>
  </div>

  <!-- 1. 放入字幕。⚠️ 文件必须按**字节**读（readAsArrayBuffer），不能按文本读：
       一按文本读，浏览器先按 UTF-8 解一遍，解不动的字节就变成替换符 —— 原始信息当场没了，
       后面再聪明的算法也修不回来。这是本页最要紧的一处。 -->
  <div class="card" id="upCard">
    <h2><span class="n">1</span><span data-i18n="upTitle">放入字幕</span></h2>
    <div class="dz" id="dz">
      <span class="dz-ico"></span>
      <span class="dz-t" data-i18n="dzTxt">把文件拖到这里，或点击选择文件</span>
      <span class="dz-f" id="fname"></span>
    </div>
    <input type="file" id="file" accept=".srt,.vtt,.ass,.ssa,.sbv,.lrc,.txt,text/*" style="display:none">
    <div class="row">
      <span class="lb" data-i18n="lblSrc">认出来的编码</span>
      <span class="chip mut" id="srcEnc">—</span>
      <button id="btnClear" type="button" data-i18n="btnClear">清除</button>
    </div>
    <div style="margin-top:12px">
      <textarea id="paste" data-i18n-ph="pastePh" placeholder="也可以直接把乱码内容粘贴到这里"></textarea>
    </div>
    <div class="hint" data-i18n="hintPaste">粘贴进来的已经不是原始字节了，能修的范围比传文件小得多。能传文件就传文件。</div>
  </div>

  <!-- 2. 诊断。先说清楚「这份到底怎么了」，再谈修不修 -->
  <div class="card" id="diagCard" style="display:none">
    <h2><span class="n">2</span><span data-i18n="lblDiag">诊断</span></h2>
    <div class="row">
      <span class="chip" id="diagStat">—</span>
    </div>
    <div class="list" id="diagList"></div>
    <div class="msg warn" id="lostMsg" style="display:none" data-i18n="msgLost"></div>
    <div class="msg" id="okMsg" style="display:none" data-i18n="msgOk"></div>
  </div>

  <!-- 3. 候选。系统挑一个最像人话的，但绝不替用户拍板 —— 全都摆出来让他自己看 -->
  <div class="card" id="fixCard" style="display:none">
    <h2><span class="n">3</span><span data-i18n="lblFix">可以这样修</span></h2>
    <div class="hint" data-i18n="hintFix">按「哪一个最像人话」排的序。点一个看看，选中之后到下面另存。</div>
    <div class="list" id="candList"></div>
  </div>

  <!-- 4. 结果。⚠️ 很多时候文件本身没坏，是播放器读错了 —— 这时候正解是「另存一份对的编码」，
       不是去改文本里任何一个字。所以这一卡永远可用，不管有没有修过。 -->
  <div class="card" id="repCard" style="display:none">
    <h2><span class="n">4</span><span data-i18n="repTitle">结果</span></h2>
    <textarea id="out" readonly style="min-height:180px"></textarea>
    <div class="row">
      <span class="lb" data-i18n="lblSave">另存为</span>
      <select class="fmt" id="saveEnc"></select>
      <button class="pri" id="btnDl" type="button" data-i18n="btnDl">下载</button>
      <button id="btnCopy" type="button" data-i18n="btnCopy">复制</button>
    </div>
    <div class="hint" data-i18n="hintSave">播放器认不出 UTF-8 时，存一份「带 BOM 的 UTF-8」（Windows 播放器靠 BOM 认编码）或者 GBK，通常就好了。</div>
    <div class="msg" id="msg" style="display:none"></div>
  </div>

  <footer>
    <span data-i18n="footBrand">随心字幕 AI · 字幕乱码修复</span>
  </footer>
</div>

<script src="repair-i18n.js?v=0.9.297"></script>
<script src="repair-core.js?v=0.9.297"></script>
<script>
'use strict';
var I18N = window.REPAIR_I18N.DICT, LANGS = window.REPAIR_I18N.LANGS;
var LANG = 'zh-CN';
var C = window.RepairCore;

var S = {
  fname: '', bytes: null, text: '',
  shown: '', enc: null, diag: null, list: [], pick: -1, out: ''
};

function $(s) { return document.querySelector(s); }
function t(k) {
  var d = I18N[LANG] || I18N['en'];
  return (d && d[k] !== undefined) ? d[k] : (I18N['zh-CN'][k] !== undefined ? I18N['zh-CN'][k] : k);
}
function esc(s) {
  return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

/* 顶部胶囊：本页自带一份，不引入 site-nav.js（那几页的导航清单不该被新页牵动） */
var NAV = [
  { key: 'navHome', href: null },
  { key: 'navTr', href: '/translate.html' },
  { key: 'navFx', href: '/merge.html' },
  { key: 'navCl', href: '/clean.html' },
  { key: 'navCv', href: '/convert.html' },
  { key: 'navSp', href: '/bilingual.html' },
  { key: 'navSh', href: '/shift.html' }
];
function renderNav() {
  var home = (LANG === 'zh-CN') ? '/' : '/' + LANG + '/';
  $('#navPills').innerHTML = NAV.map(function (n) {
    var href = n.href === null ? home : ((LANG === 'zh-CN') ? n.href : '/' + LANG + n.href);
    return '<a class="pill" href="' + href + '" data-nav="' + n.key + '"></a>';
  }).join('');
  NAV.forEach(function (n) {
    var el = $('#navPills').querySelector('[data-nav="' + n.key + '"]');
    if (el) el.textContent = t(n.key);
  });
}
function applyI18n() {
  document.documentElement.lang = LANG;
  /* 阿拉伯语 / 希伯来语整页从右往左排 */
  document.documentElement.dir = (['ar','fa','he','ur','ps','ku','ug','sd','yi'].indexOf(LANG) >= 0) ? 'rtl' : 'ltr';
  Array.prototype.forEach.call(document.querySelectorAll('[data-i18n]'), function (el) {
    el.textContent = t(el.getAttribute('data-i18n'));
  });
  Array.prototype.forEach.call(document.querySelectorAll('[data-i18n-ph]'), function (el) {
    el.setAttribute('placeholder', t(el.getAttribute('data-i18n-ph')));
  });
  renderNav();
  renderSaveEnc();
}

/* ---------------- 另存：编码清单 ----------------
   ⚠️ 编码名是专有名词，各国写法一样，不走词典；只有「带 BOM」这个说法要翻译。 */
var SAVE_ENCS = [
  { id: 'utf-8', bom: false, name: 'UTF-8' },
  { id: 'utf-8', bom: true, name: '' },      /* name 由 encUtf8bom 提供 */
  { id: 'gbk', bom: false, name: 'GBK' },
  { id: 'big5', bom: false, name: 'Big5' },
  { id: 'shift_jis', bom: false, name: 'Shift_JIS' },
  { id: 'euc-kr', bom: false, name: 'EUC-KR' }
];
function renderSaveEnc() {
  var sel = $('#saveEnc'), cur = sel.value;
  sel.innerHTML = SAVE_ENCS.map(function (e, i) {
    return '<option value="' + i + '">' + esc(e.bom ? t('encUtf8bom') : e.name) + '</option>';
  }).join('');
  /* 认出来的编码不是 UTF-8，就把另存默认指到「带 BOM 的 UTF-8」—— 这是播放器读错时最管用的一种 */
  if (cur === '' && S.enc && S.enc !== 'utf-8') sel.value = '1';
  else if (cur !== '') sel.value = cur;
}

/* ---------------- 主流程 ---------------- */
function run() {
  var hasBytes = !!(S.bytes && S.bytes.length);
  var hasText = !!S.text.trim();
  if (!hasBytes && !hasText) { reset(); return; }
  var r = C.repair({ bytes: S.bytes, text: S.text });
  S.shown = r.shown; S.enc = r.enc; S.diag = r.diag; S.list = r.list;
  S.pick = r.best ? 0 : -1;
  S.out = S.pick >= 0 ? S.list[S.pick].text : S.shown;
  renderDiag(r);
  renderCands();
  renderResult();
}

function reset() {
  ['diagCard', 'fixCard', 'repCard'].forEach(function (id) { $('#' + id).style.display = 'none'; });
  S.shown = ''; S.enc = null; S.diag = null; S.list = []; S.pick = -1; S.out = '';
  $('#srcEnc').className = 'chip mut'; $('#srcEnc').textContent = '—';
  hideMsg();
}

function renderDiag(r) {
  var card = $('#diagCard'), stat = $('#diagStat'), box = $('#diagList');
  card.style.display = '';
  var el = $('#srcEnc');
  if (S.enc) { el.className = 'chip'; el.textContent = S.enc.toUpperCase(); }
  else { el.className = 'chip mut'; el.textContent = '—'; }

  var reasons = r.diag.reasons || [];
  stat.className = reasons.length ? 'chip' : 'chip mut';
  stat.textContent = reasons.length ? t('dgMoji') : t('dgClean');
  box.innerHTML = reasons.map(function (k) {
    return '<div class="cand"><span class="tx">' + esc(t('dg_' + k)) + '</span></div>';
  }).join('');
  box.style.display = reasons.length ? '' : 'none';

  /* 已经不可逆：只可能在「粘贴」这条路出现，直说，别给假希望 */
  $('#lostMsg').style.display = (r.lost && r.list.length === 0) ? '' : 'none';
  $('#okMsg').style.display = (reasons.length === 0) ? '' : 'none';
}

function renderCands() {
  var card = $('#fixCard'), box = $('#candList');
  if (!S.list.length) { card.style.display = 'none'; return; }
  card.style.display = '';
  /* 第一行永远是「保持原样」—— 自动挑的那个万一不是他要的，得有地方退回去 */
  var html = '<div class="cand' + (S.pick < 0 ? ' on' : '') + '">'
    + '<span class="enc">' + esc(t('btnKeep')) + '</span>'
    + '<span class="tx">' + esc(S.shown.slice(0, 90).replace(/\n/g, ' ⏎ ')) + '</span>'
    + '<span class="op"><button type="button" data-use="-1">' + esc(t('btnUse')) + '</button></span></div>';
  html += S.list.map(function (c, i) {
    return '<div class="cand' + (S.pick === i ? ' on' : '') + '">'
      + '<span class="enc">' + esc(C.label(c)) + '</span>'
      + '<span class="tx">' + esc(c.text.slice(0, 90).replace(/\n/g, ' ⏎ ')) + '</span>'
      + '<span class="op"><button type="button" data-use="' + i + '">' + esc(t('btnUse')) + '</button></span></div>';
  }).join('');
  box.innerHTML = html;
  Array.prototype.forEach.call(box.querySelectorAll('[data-use]'), function (b) {
    b.addEventListener('click', function () {
      S.pick = Number(b.getAttribute('data-use'));
      S.out = S.pick >= 0 ? S.list[S.pick].text : S.shown;
      renderCands();
      renderResult();
    });
  });
}

function renderResult() {
  $('#repCard').style.display = '';
  /* 特别大的文件只喂前两万字进去，不然光渲染就把页面拖住 */
  $('#out').value = S.out.length > 20000 ? S.out.slice(0, 20000) : S.out;
  hideMsg();
}

function showMsg(k, kind) {
  var m = $('#msg');
  m.textContent = t(k);
  m.className = 'msg' + (kind ? ' ' + kind : '');
  m.style.display = '';
}
function hideMsg() { $('#msg').style.display = 'none'; }

/* ---------------- 输入 ---------------- */
/* 文本入口对外暴露（自动化冒烟用）；页面自身的上传与粘贴都走这里 */
function setSrc(text, fname) {
  S.bytes = null;
  S.text = String(text || '');
  S.fname = fname || S.fname || '';
  $('#fname').textContent = S.fname;
  if ($('#paste').value !== S.text) $('#paste').value = S.text;
  run();
}
function setBytes(buf, fname) {
  S.bytes = new Uint8Array(buf);
  S.text = '';
  S.fname = fname || '';
  $('#fname').textContent = S.fname;
  $('#paste').value = '';
  run();
}
function readFile(f) {
  if (!f) return;
  var r = new FileReader();
  /* ⚠️ 按字节读。readAsText 会先按 UTF-8 解一遍，解不动的字节就永久变成替换符了 */
  r.onload = function () { setBytes(r.result, f.name); };
  r.readAsArrayBuffer(f);
}
function clearAll() {
  S.fname = ''; S.bytes = null; S.text = '';
  $('#fname').textContent = '';
  $('#paste').value = '';
  $('#file').value = '';
  reset();
}

function outName() {
  var base = (S.fname || '').replace(/\.[^.]+$/, '') || 'subtitle';
  var ext = ((S.fname || '').match(/\.[^.]+$/) || ['.txt'])[0];
  return base + '-fixed' + ext;
}
function download() {
  var e = SAVE_ENCS[Number($('#saveEnc').value) || 0];
  var b = C.toBytes(S.out, e.id);
  if (!b) { showMsg('msgEncFail', 'err'); return; }
  var out = b;
  if (e.bom) {
    out = new Uint8Array(3 + b.length);
    out.set([0xEF, 0xBB, 0xBF], 0);
    out.set(b, 3);
  }
  var blob = new Blob([out], { type: 'text/plain;charset=' + e.id });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = outName();
  document.body.appendChild(a); a.click();
  setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 0);
  showMsg('msgDone');
}
function copyOut() {
  var ta = $('#out');
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(S.out).then(function () { showMsg('msgCopy'); }, function () { fallbackCopy(ta); });
      return;
    }
  } catch (e) { /* 非安全上下文里没有 clipboard，走下面的老办法 */ }
  fallbackCopy(ta);
}
function fallbackCopy(ta) {
  try {
    ta.focus(); ta.select();
    document.execCommand('copy');
    showMsg('msgCopy');
  } catch (e) { showMsg('msgEmpty', 'err'); }
}

/* ---------------- 语言 ---------------- */
function pathUiLang() {
  var m = String(location.pathname || '').match(/^\/([a-zA-Z]{2,3}(?:-[a-zA-Z]{2,4})?)\/repair\.html/);
  if (m && LANGS.some(function (x) { return x[0] === m[1]; })) return m[1];
  return null;
}
function initLang() {
  var sel = $('#langSel');
  sel.innerHTML = LANGS.map(function (p) { return '<option value="' + p[0] + '">' + p[1] + '</option>'; }).join('');
  var saved = 'zh-CN';
  try { saved = localStorage.getItem('srt_repair_lang') || 'zh-CN'; } catch (e) { saved = 'zh-CN'; }
  if (!LANGS.some(function (x) { return x[0] === saved; })) saved = 'zh-CN';
  LANG = pathUiLang() || saved;
  sel.value = LANG;
  sel.addEventListener('change', function () {
    LANG = sel.value;
    try { localStorage.setItem('srt_repair_lang', LANG); } catch (e) { /* 隐私模式写不了，忽略 */ }
    applyI18n();
    if (S.list.length) { renderCands(); }
    if (S.diag) { renderDiag({ diag: S.diag, lost: false, list: S.list }); }
  });
}

/* ---------------- 绑定 ---------------- */
function bind() {
  var dz = $('#dz'), file = $('#file');
  dz.addEventListener('click', function () { file.click(); });
  dz.addEventListener('dragover', function (e) { e.preventDefault(); dz.classList.add('over'); });
  dz.addEventListener('dragleave', function () { dz.classList.remove('over'); });
  dz.addEventListener('drop', function (e) {
    e.preventDefault(); dz.classList.remove('over');
    if (e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0]) readFile(e.dataTransfer.files[0]);
  });
  file.addEventListener('change', function () { readFile(file.files && file.files[0]); });
  var timer = null;
  $('#paste').addEventListener('input', function () {
    clearTimeout(timer);
    timer = setTimeout(function () {
      S.bytes = null;
      S.text = $('#paste').value;
      run();
    }, 350);
  });
  $('#btnClear').addEventListener('click', clearAll);
  $('#btnDl').addEventListener('click', download);
  $('#btnCopy').addEventListener('click', copyOut);
}

(function main() {
  initLang();
  applyI18n();
  bind();
  reset();
})();
</script>
</body>
</html>
